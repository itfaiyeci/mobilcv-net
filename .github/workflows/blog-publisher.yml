name: Blog Publisher

on:
  schedule:
    - cron: '0 9 * * 1'   # Her pazartesi 09:00 UTC (Türkiye saatiyle 12:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Makaleleri üret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          cd MobilCV.AIEngine
          dotnet restore
          dotnet run

      - name: Değişiklikleri gönder
        run: |
          git config user.name "MobilCV Bot"
          git config user.email "bot@mobilcv.net"
          git add . 
          echo "NEW_FILES=$(git diff --cached --name-only --diff-filter=A -- '*.html' | wc -l)" >> $GITHUB_ENV
          echo "NOW=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
          git diff --cached --quiet || git commit -m "Otomatik makale $(date -u +'%Y-%m-%d')"
          git push

      - name: E-posta bildirimi gönder
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ MobilCV: ${{ env.NEW_FILES }} yeni sayfa yayınlandı"
          to: ${{ secrets.MAIL_TO }}
          from: MobilCV Bot
          body: |
            Merhaba,

            MobilCV botu çalıştı.

            Tarih: ${{ env.NOW }}
            Yeni HTML sayfa sayısı: ${{ env.NEW_FILES }}
            Blog: https://mobilcv.net

            MobilCV Bot
