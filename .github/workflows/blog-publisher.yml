name: Blog Publisher

on:
  schedule:
    - cron: '0 9 * * 1'   # Her pazartesi 09:00 UTC (Türkiye saatiyle 12:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Makaleleri üret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          cd MobilCV.AIEngine
          dotnet restore
          dotnet run

      - name: Değişiklikleri gönder
        run: |
          git config user.name "MobilCV Bot"
          git config user.email "bot@mobilcv.net"
          git add . 
          echo "NEW_FILES=$(git diff --cached --name-only --diff-filter=A -- '*.html' | wc -l)" >> $GITHUB_ENV
          echo "NOW=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
          git diff --cached --quiet || git commit -m "Otomatik makale $(date -u +'%Y-%m-%d')"
          git push

     
