name: Instagram ve Threads paylasim
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "kontrol (paylasim yok) ya da paylas"
        required: true
        default: kontrol
        type: choice
        options: [kontrol, paylas]
  push:
    branches: [main]
    paths: ["sosyal/kuyruk.json"]
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calistir
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=paylas; fi
          python3 scripts/ig_paylas.py "$ISLEM"
      - name: Instagram EN
        if: always()
        env:
          IG_TOKEN_EN: ${{ secrets.IG_TOKEN_EN }}
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=paylas; fi
          python3 scripts/ig_paylas.py "$ISLEM" en
      - name: Threads
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=paylas; fi
          python3 scripts/th_paylas.py "$ISLEM"
      - name: Threads EN
        if: always()
        env:
          THREADS_TOKEN_EN: ${{ secrets.THREADS_TOKEN_EN }}
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=paylas; fi
          python3 scripts/th_paylas.py "$ISLEM" en
      - name: Facebook sayfa
        if: always()
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          ISLEM="${{ github.event.inputs.islem }}"
          if [ -z "$ISLEM" ]; then ISLEM=paylas; fi
          python3 scripts/fb_paylas.py "$ISLEM"
      - name: Kuyrugu kaydet
        if: always() && github.event.inputs.islem != 'kontrol'
        run: |
          if ! git diff --quiet sosyal/kuyruk.json; then
            git config user.name itfaiyeci
            git config user.email 53007622+itfaiyeci@users.noreply.github.com
            git commit -m "Sosyal: paylasilan gonderiler kayda gecti [skip ci]" sosyal/kuyruk.json
            git push
          fi
